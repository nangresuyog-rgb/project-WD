<!DOCTYPE html>
<html>
<head>
    <title>The Incredibles</title>
    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        .movie {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 30px;
        }
        .movie img {
            width: 400px;
            border-radius: 12px;
        }
        .movie-info {
            text-align: center;
        }
        .studio {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
        .title {
            color: #ff9d00;
            font-size: 65px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-top: 20px;
        }
        .watch {
            margin-top: 30px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="movie">
    <img src="img08.html.jpeg" alt="The Incredibles">
    <div class="movie-info">
        <div class="studio">
            DISNEY • PIXAR
        </div>
        <div class="title">
            THE<br>
            INCREDIBLES
        </div>
        <button class="watch">
            ▶ Watch Now
        </button>
    </div>
</div>
</body>
</html>
