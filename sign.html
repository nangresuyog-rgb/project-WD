<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NS Screen - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
                url("background.jpg");

            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Logo */
        .logo {
            position: absolute;
            top: 25px;
            left: 40px;
            font-size: 32px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 2px;
        }

        /* Login Box */
        .login-box {
            width: 400px;
            padding: 45px 40px;
            background: rgba(0, 0, 0, 0.78);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        }

        .login-box h1 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        /* Input */
        .input-box {
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 16px;
            border: none;
            outline: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: #aaa;
        }

        .input-box input:focus {
            background: #444;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background: #e50914;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #b20710;
        }

        /* Remember */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }

        .remember {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .options a {
            color: #aaa;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
            color: white;
        }

        /* Signup */
        .signup {
            margin-top: 45px;
            color: #aaa;
            font-size: 16px;
        }

        .signup a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .logo {
                left: 20px;
                top: 20px;
                font-size: 25px;
            }

            .login-box {
                width: 90%;
                padding: 35px 25px;
            }

            .login-box h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Logo -->
    <div class="logo">
        NS SCREEN
    </div>

    <!-- Login Box -->
    <div class="login-box">

        <h1>Sign In</h1>

        <form>

            <div class="input-box">
                <input type="email"
                       placeholder="Email or mobile number"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       placeholder="Password"
                       required>
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

        </form>

        <div class="signup">
            New to NS Screen?
            <a href="#">Sign up now.</a>
        </div>

    </div>
    <script>
        
    </script>

</body>
</html>
