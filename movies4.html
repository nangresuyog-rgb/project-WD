<!DOCTYPE html>
<html>
<head>
    <title>Animal</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .movie {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 30px;
        }

        .movie img {
            width: 400px;
            border-radius: 12px;
        }

        .movie-info {
            text-align: center;
        }

        .title {
            color: #ffd700;
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .watch {
            margin-top: 30px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .watch:hover {
            background: #ff1a1a;
        }
    </style>
</head>

<body>

<div class="movie">

    <img src="img04.html.jpeg" alt="Animal">

    <div class="movie-info">

        <div class="title">
            ANIMAL
        </div>

        <button class="watch">
            ▶ Watch Now
        </button>

    </div>

</div>

</body>
</html>
