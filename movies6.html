<!DOCTYPE html>
<html>
<head>
    <title>Loki Season 2</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .movie {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 30px;
        }

        .movie img {
            width: 400px;
            border-radius: 12px;
        }

        .movie-info {
            text-align: center;
        }

        .studio {
            font-size: 25px;
            font-weight: bold;
        }

        .title {
            font-size: 80px;
            color: #b7c9a8;
            font-weight: bold;
            letter-spacing: 10px;
        }

        .season {
            font-size: 35px;
            color: #70c34a;
            margin-top: 10px;
        }

        .watch {
            margin-top: 30px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="movie">

    <img src="img06.html.jpeg" alt="Loki Season 2">

    <div class="movie-info">

        <div class="studio">
            MARVEL STUDIOS
        </div>

        <div class="title">
            LOKI
        </div>

        <div class="season">
            SEASON 2
        </div>

        <button class="watch">
            ▶ Watch Now
        </button>

    </div>

</div>

</body>
</html>
