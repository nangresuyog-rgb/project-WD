<!DOCTYPE html>
<html>
<head>
    <title>War</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        .movie {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 30px;
        }

        .movie img {
            width: 400px;
            border-radius: 12px;
        }

        .movie-info {
            text-align: center;
        }

        .title {
            font-size: 100px;
            color: white;
            font-weight: bold;
            letter-spacing: 10px;
            text-shadow: 4px 4px 10px #777;
        }

        .subtitle {
            font-size: 25px;
            color: #aaa;
            margin-top: 10px;
        }

        .watch {
            margin-top: 30px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="movie">

    <img src="img07.html.jpeg" alt="War">

    <div class="movie-info">

        <div class="title">
            WAR
        </div>

        <div class="subtitle">
            HRITHIK VS TIGER
        </div>

        <button class="watch">
            ▶ Watch Now
        </button>

    </div>
</div>
</body>
</html>
