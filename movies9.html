<!DOCTYPE html>
<html>
<head>
    <title>Deadpool & Wolverine</title>
    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }
        .movie {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 30px;
        }
        .movie img {
            width: 400px;
            border-radius: 12px;
        }
        .movie-info {
            text-align: center;
        }
        .studio {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .deadpool {
            color: #e50914;
            font-size: 65px;
            font-weight: bold;
            letter-spacing: 4px;
        }
        .wolverine {
            color: #ffd400;
            font-size: 55px;
            font-weight: bold;
            letter-spacing: 4px;
        }
        .watch {
            margin-top: 30px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="movie">
    <img src="img09.html.jpeg" alt="Deadpool and Wolverine">
    <div class="movie-info">
        <div class="studio">
            MARVEL STUDIOS
        </div>
        <div class="deadpool">
            DEADPOOL
        </div>
        <div class="wolverine">
            & WOLVERINE
        </div>
        <button class="watch">
            ▶ Watch Now
        </button>
    </div>
</div>
</body>
</html>
